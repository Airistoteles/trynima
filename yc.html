<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Nima</title>
<meta name="robots" content="noindex" />
<meta name="theme-color" content="#1C2532" />
<link rel="icon" type="image/png" href="favicon.png" />
<style>
  /* YC-video page v4. Richard alone, chilling, on a camera-friendly warm
     paper tone (pure white blooms on film). EVERYTHING timer-free:
     the Output Wall's webview suspends JS timers (measured 2026-07-27:
     breathing CSS ran while a blink chain sat frozen mid-blink), so ALL
     motion here is CSS keyframes. The answer beat is driven from outside:
     `cmux browser <surface> eval "window.__perform()"` + afplay on the Mac
     (browser audio needs a gesture; afplay needs nothing). Click/keypress
     still work when the page runs focused in a normal browser. */
  :root{
    --ink:#211E18; --muted:#6C6456; --teal:#0E7C67; --amber:#DE7F35;
  }
  *{box-sizing:border-box; margin:0}
  html,body{height:100%}
  body{
    background:#1C2532; color:var(--ink);
    font-family:system-ui,sans-serif;
    -webkit-font-smoothing:antialiased;
    overflow:hidden; cursor:none;
  }
  .stage{position:relative; height:100svh}

  .boardprop{
    position:absolute; z-index:1;
    left:5vw; top:50%; transform:translateY(-55%) rotate(-.5deg);
    width:min(42vw, 680px); aspect-ratio:4/3;
    background:radial-gradient(120% 120% at 30% 25%, #33403A 0%, #2A3630 55%, #242E29 100%);
    border:10px solid #6E543C; border-radius:10px;
    box-shadow:0 22px 60px rgba(0,0,0,.45), inset 0 0 40px rgba(0,0,0,.25);
  }
  .boardprop .tray{
    position:absolute; left:10%; bottom:-30px; width:48%; height:13px;
    background:#6E543C; border-radius:4px;
  }
  .boardprop .marker{
    position:absolute; left:15%; bottom:-24px; width:56px; height:8px;
    background:#EDE8DC; border-radius:4px; transform:rotate(-1deg);
  }

  .richard{
    position:absolute; z-index:1; right:0; bottom:-12vh;
    width:min(92vh, 60vw);
    pointer-events:none; user-select:none;
    /* Camera dim (Philip 2026-07-27): the art is too bright against the
       dark stage on film. On the common parent so every patch keyframe
       dims identically with the base. */
    filter:brightness(.6) saturate(.88);
  }
  .breath{
    position:relative; transform-origin:50% 100%;
    animation:breath 6.4s ease-in-out infinite;
  }
  @keyframes breath{0%,100%{transform:scale(1)} 50%{transform:scale(1.007)}}
  .richard img{display:block; width:100%; height:auto}
  .richard .patch{position:absolute; opacity:0}
  .richard .lid{left:29.297%; top:38.086%; width:41.992%}
  .richard .mouth{left:30.762%; top:51.758%; width:39.062%}

  /* CHILLING BLINKS — pure CSS, hard step cuts, one blink per 8.6s cycle
     (0-45ms half, 45-145 closed, 145-200 half, open the rest). The cycle
     starting at 0% doubles as the entrance blink. */
  .richard .lid.half{animation:lidHalf 8.6s step-end infinite}
  .richard .lid.shut{animation:lidShut 8.6s step-end infinite}
  @keyframes lidHalf{
    0%{opacity:1} 0.52%{opacity:0} 1.69%{opacity:1} 2.33%{opacity:0} 100%{opacity:0}
  }
  @keyframes lidShut{
    0%{opacity:0} 0.52%{opacity:1} 1.69%{opacity:0} 100%{opacity:0}
  }

  /* THE ANSWER BEAT (class .perform on <body>) — all CSS, one shot:
     noticing lift + double blink + head-tip (on .beat), then a 2.95s
     syllabic mouth pattern in hard cuts while the voice plays. */
  .beat{position:relative; transform-origin:50% 100%}
  .perform .beat{animation:beatMove 2.2s cubic-bezier(.33,0,.35,1) 1}
  @keyframes beatMove{
    0%{transform:none}
    5%,14%{transform:translateY(-10px) scale(.988)}
    26%{transform:none}
    34%,72%{transform:rotate(-1.2deg) scale(1.015)}
    100%{transform:none}
  }
  /* double blink while noticing, then the idle cycle resumes */
  .perform .lid.half{animation:performHalf 8.6s step-end 1}
  .perform .lid.shut{animation:performShut 8.6s step-end 1}
  @keyframes performHalf{
    0%{opacity:1} 0.52%{opacity:0} 1.69%{opacity:1} 2.33%{opacity:0}
    3.26%{opacity:1} 3.78%{opacity:0} 4.94%{opacity:1} 5.58%{opacity:0} 100%{opacity:0}
  }
  @keyframes performShut{
    0%{opacity:0} 0.52%{opacity:1} 1.69%{opacity:0}
    3.78%{opacity:1} 4.94%{opacity:0} 100%{opacity:0}
  }
  /* the syllabic mouth — 2.95s, step cuts, self-ending (iteration 1) */
  .perform .mouth.m1{animation:talkSmall 2.8s step-end 1 .55s}
  .perform .mouth.m2{animation:talkHalf 2.8s step-end 1 .55s}
  .perform .mouth.m3{animation:talkOpen 2.8s step-end 1 .55s}
  @keyframes talkSmall{
    0%{opacity:0} 4%{opacity:1} 12%{opacity:0} 20%{opacity:1} 26%{opacity:0}
    36%{opacity:1} 42%{opacity:0} 55%{opacity:1} 61%{opacity:0}
    72%{opacity:1} 78%{opacity:0} 88%{opacity:1} 93%{opacity:0} 100%{opacity:0}
  }
  @keyframes talkHalf{
    0%{opacity:0} 12%{opacity:1} 20%{opacity:0} 29%{opacity:1} 36%{opacity:0}
    46%{opacity:1} 52%{opacity:0} 61%{opacity:1} 67%{opacity:0}
    78%{opacity:1} 83%{opacity:0} 100%{opacity:0}
  }
  @keyframes talkOpen{
    0%{opacity:0} 26%{opacity:1} 29%{opacity:0} 42%{opacity:1} 46%{opacity:0}
    67%{opacity:1} 72%{opacity:0} 83%{opacity:1} 88%{opacity:0} 100%{opacity:0}
  }
  @media (prefers-reduced-motion: reduce){
    .breath, .richard .lid{animation:none}
  }
</style>
</head>
<body>
  <div class="stage" id="stage">
    <div class="boardprop" aria-hidden="true"><span class="tray"></span><span class="marker"></span></div>
    <div class="richard" aria-hidden="true">
      <div class="breath">
        <div class="beat">
          <img src="richard.png" alt="" fetchpriority="high" />
          <img class="patch lid half" src="blink-half.png" alt="" />
          <img class="patch lid shut" src="blink.png" alt="" />
          <img class="patch mouth m1" src="mouth-small.png" alt="" />
          <img class="patch mouth m2" src="mouth-half.png" alt="" />
          <img class="patch mouth m3" src="mouth-open.png" alt="" />
        </div>
      </div>
    </div>
  </div>

  <audio id="voice" src="yc-answer.mp3" preload="auto"></audio>

  <script>
    // The whole beat is CSS; this only flips the class (works from an
    // external `cmux browser eval` even when the webview suspends timers)
    // and best-effort plays the page audio (needs a gesture in normal
    // browsers; the wall lane plays the voice via afplay instead).
    var voice = document.getElementById('voice');
    window.__perform = function (withAudio) {
      var b = document.body;
      b.classList.remove('perform');
      void b.offsetWidth; // reflow: restart the one-shot animations cleanly
      b.classList.add('perform');
      if (withAudio !== false) {
        try {
          voice.currentTime = 0;
          var p = voice.play();
          if (p && p.catch) p.catch(function () {});
        } catch (e) {}
      }
    };
    document.addEventListener('keydown', function (e) { if (!e.repeat) window.__perform(); });
    document.addEventListener('pointerdown', function () { window.__perform(); });
    var padWas = false;
    (function pollPad() {
      var pads = navigator.getGamepads ? navigator.getGamepads() : [];
      var down = false;
      for (var i = 0; i < pads.length; i++) {
        var p = pads[i];
        if (p) for (var b = 0; b < p.buttons.length; b++) if (p.buttons[b].pressed) down = true;
      }
      if (down && !padWas) window.__perform();
      padWas = down;
      requestAnimationFrame(pollPad);
    })();
  </script>
</body>
</html>
